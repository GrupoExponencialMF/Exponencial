<style>
:root{
  --navy:#081630; --navy2:#10264A; --ink:#0B1A33; --ink2:#4B5B76; --ink3:#8593AB; --line:rgba(11,26,51,.08);
  --card:rgba(255,255,255,.68); --card2:rgba(246,249,253,.72); --edge:rgba(255,255,255,.6);
  --blue:#3D7BFF; --exp:#5DB33A; --uvm:#E8455F; --iada:#F08A24;
  --ok:#1F9D68; --ok-bg:#E2F5EC; --bad:#E5484D; --bad-bg:#FDE7E8; --neu:#C5CEDC;
  --sh:0 1px 0 rgba(255,255,255,.7) inset,0 24px 48px -28px rgba(8,22,48,.45),0 2px 6px -2px rgba(8,22,48,.08);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light } }
:root[data-theme="dark"]{ color-scheme:light }
html{scroll-padding-top:env(safe-area-inset-top,0px);background-color:#E9EEF6;background-image:
  radial-gradient(38% 22% at 92% 34%,rgba(92,134,214,.55),transparent 72%),
  radial-gradient(30% 18% at 4% 52%,rgba(70,112,196,.42),transparent 70%),
  radial-gradient(34% 16% at 60% 63%,rgba(150,180,232,.40),transparent 72%),
  radial-gradient(40% 20% at 96% 82%,rgba(84,124,204,.42),transparent 70%),
  radial-gradient(36% 18% at 18% 92%,rgba(120,156,222,.32),transparent 72%),
  linear-gradient(180deg,#C9D6EA 0%,#DCE5F2 40%,#E9EEF6 70%,#DDE6F3 100%)}
.app{position:relative;isolation:isolate}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--band,440px);z-index:-1;
  background:
   radial-gradient(42% 60% at 86% 8%,rgba(64,124,255,.55),transparent 70%),
   radial-gradient(30% 45% at 58% 30%,rgba(34,78,170,.45),transparent 72%),
   radial-gradient(70% 78% at 12% 0%,#050F24 0%,#081834 55%,rgba(8,24,52,0) 100%),
   radial-gradient(60% 95% at 78% 0%,#0B1F48 0%,#123064 50%,rgba(18,48,100,0) 100%),
   radial-gradient(45% 70% at 40% 20%,#0A1B3C 0%,rgba(10,27,60,0) 100%),
   linear-gradient(180deg,#06122A 0%,#0B1E42 48%,rgba(14,38,82,.55) 78%,rgba(14,38,82,0) 100%)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;background:#06122A;box-shadow:inset -1px 0 0 rgba(255,255,255,.06);padding:22px 16px;display:flex;flex-direction:column;color:#C9D4E8}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 0}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,#5D93FF,#2549B8);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(61,123,255,.8)}
.brand b{display:block;color:#fff;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.brand small{font-size:11.5px;color:#8FA2C4}
.nav{margin-top:30px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:500;color:#AFBEDA;transition:background .15s,color .15s}
.nav button svg{width:18px;height:18px;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.nav button.on svg{opacity:1;color:#8DB4FF}
.navsep{font-size:11px;color:#6F82A6;margin:18px 12px 6px;font-weight:500}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,#F3C9A8,#D9876A);display:grid;place-items:center;color:#3A1A0C;font-weight:700;font-size:14px}
.me b{display:block;color:#fff;font-size:13.5px;font-weight:600}.me small{color:#8FA2C4;font-size:11.5px}
/* Main */
main{padding:24px 32px 56px;max-width:1380px;width:100%;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hello{color:#fff}
.hello small{display:block;color:#93A8CC;font-size:13px}
.hello h1{margin:2px 0 0;font-size:26px;font-weight:600;letter-spacing:-.025em}
.per{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);border-radius:999px;padding:4px}
.per span{color:#93A8CC;font-size:12.5px;padding:0 10px}
.per select{all:unset;cursor:pointer;background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
/* Hero */
.hero{margin:26px 0 22px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end;color:#fff}
.hk{font-size:13px;color:#93A8CC;display:flex;align-items:center;gap:8px}
.hk i{width:6px;height:6px;border-radius:50%;background:#7CF0B4;box-shadow:0 0 0 4px rgba(124,240,180,.18)}
.hn{font-size:64px;font-weight:600;letter-spacing:-.045em;line-height:1;margin:10px 0 12px}
.hn sup{font-size:.36em;vertical-align:1.25em;color:#93A8CC;font-weight:500;letter-spacing:0;margin-left:2px}
.hs{font-size:14px;color:#C3D0E6}.hs b{color:#fff;font-weight:600}
.pace{margin-top:34px}
.pt{position:relative;height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:visible}
.pt .f{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#5D93FF,#8DB4FF)}
.pt .e{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;border-radius:2px}
.pt .e span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;color:#fff;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:999px}
.pl{display:flex;justify-content:space-between;font-size:11.5px;color:#7F94BA;margin-top:8px}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hst{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;backdrop-filter:blur(10px)}
.hst small{font-size:12px;color:#93A8CC}
.hst b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.hst em{font-style:normal;font-size:11.5px;color:#93A8CC}
/* Sections */
.sec{margin-top:26px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 2px 12px}
.sh h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sh p{margin:2px 0 0;font-size:12.5px;color:var(--ink3)}
.sh.on-dark h2{color:#fff}.sh.on-dark p{color:#C3D1EA}
.lnk{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--blue)}
.on-dark .lnk{color:#A9C4FF}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--sh);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);padding:20px;position:relative;overflow:hidden}
.chh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chn{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;min-width:0}
.cb{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;background:var(--k);box-shadow:0 6px 14px -6px var(--k);flex:none}
.tag{font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--card2);padding:4px 10px;border-radius:999px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.glow{position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--k),transparent 70%);opacity:.14;pointer-events:none}
/* General */
.gv{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:16px 0 0;white-space:nowrap}
.gv sup{font-size:.45em;vertical-align:1em;color:var(--ink3);font-weight:500}
.gl{font-size:12px;color:var(--ink3)}
.spark{margin:10px -4px 4px;height:54px}

  .cbar .srch{order:-1;flex:1 1 100%;background:#fff;box-shadow:0 2px 10px -4px rgba(11,26,51,.25);border:0;padding:11px 16px;font-size:14px}
  .cbar .chips{flex-wrap:nowrap;overflow-x:auto;flex:1 1 100%;scrollbar-width:none}
  .cbar .chips button{flex:none;background:rgba(255,255,255,.9)}
  .cbar select{flex:1 1 calc(50% - 4px);min-width:0;background:rgba(255,255,255,.95);border:0;box-shadow:0 2px 8px -4px rgba(11,26,51,.25)}
  .cbar .seg{flex:none;background:rgba(255,255,255,.85)}.cbar .vsw{margin-left:auto}
  .cbar .tgl{flex:1 1 auto}
  .sec{margin-top:18px}
  .sh h2{font-size:16px}.sh p{font-size:12px}
  /* Tarjetas en carrusel horizontal */
  .g3,.g3.g3f{display:grid!important;grid-auto-flow:column;grid-template-columns:none!important;grid-auto-columns:86%;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -14px;padding:2px 14px 10px;scrollbar-width:none}
  .g3>.card{scroll-snap-align:center;grid-column:auto!important}
  .card{border-radius:20px;padding:16px}
  /* Encabezado del Dashboard */
  .hero{margin:14px 0 10px!important;gap:16px}.hn{font-size:38px!important}.hs{font-size:12.5px}
  .hstats{display:flex!important;overflow-x:auto;gap:8px;margin:0 -14px;padding:0 14px;scrollbar-width:none}.hst{flex:0 0 42%}
  .per{width:100%;justify-content:space-between}.per .sw{flex:none}
  .akp{grid-template-columns:1fr 1fr!important}
  /* Fichas y formularios como hojas inferiores */
  .dwb{align-items:flex-end;justify-content:stretch}
  .dw,.dw.wide2{width:100%;height:auto;max-height:92vh;border-radius:26px 26px 0 0;animation:sheet .28s cubic-bezier(.2,.7,.2,1)}
  .dwh{border-radius:26px 26px 0 0;padding-top:28px}
  .dwh::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.35)}
  .dwa{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.dwa>*{flex:none}
  .eks{grid-template-columns:1fr 1fr}
  .mdw{align-items:flex-end;padding:0}
  .md,.md.wide,.md.xwide{max-width:none;width:100%;border-radius:26px 26px 0 0;max-height:92vh;padding:26px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheet .28s cubic-bezier(.2,.7,.2,1);position:relative}
  .md::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:9px;background:#D5DDEA}
  .fg{grid-template-columns:1fr!important}
  .edact{position:sticky;bottom:-18px;background:#fff;padding:12px 0 4px;margin-top:8px}
  .edact .btn1,.edact .btn2{flex:1;text-align:center;justify-content:center}
  /* Listas como tarjetas limpias */
  .ltab{padding:6px;background:transparent!important;border:0!important;box-shadow:none!important}
  .lr,.plr,.vlr,.alr{background:#fff!important;border-radius:16px!important;margin-bottom:8px;grid-template-columns:1fr auto!important;box-shadow:0 1px 3px rgba(11,26,51,.08)!important;padding:12px!important}
  .lr+.lr{box-shadow:0 1px 3px rgba(11,26,51,.08)!important}
  .lr>span:nth-child(n+3){grid-column:1/-1}
  .lr>span:nth-child(2){justify-self:end}
  /* Propuestas enviadas del Dashboard como tarjetas */
  .pet{overflow:visible}.peh{display:none!important}
  .prw{min-width:0!important;grid-template-columns:1fr 1fr!important;gap:6px 12px!important;background:#fff;border-radius:14px;margin-bottom:8px;padding:12px!important}
  .prw+.prw{box-shadow:none!important}
  .prw>span:first-child,.prw>span:nth-child(6){grid-column:1/-1}
  .prw>span:nth-child(2)::before{content:"Envío";display:block;font-size:10.5px;color:var(--ink3);font-weight:600}
  .prw>span:nth-child(3)::before{content:"Tipo";display:block;font-size:10.5px;color:var(--ink3);font-weight:600}
  .prw>span:nth-child(6)::before{content:"Último seguimiento";display:block;font-size:10.5px;color:var(--ink3);font-weight:600}
  /* Inicio */
  .wk{gap:5px}.wd{padding:8px 2px;border-radius:14px}.wd b{font-size:17px}
  .ag{grid-template-columns:44px 26px minmax(0,1fr)!important;padding:10px}.agr{grid-column:3;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}
  .ilay2{gap:14px}
  /* Ventas */
  .vk{padding:14px}.vkh em{font-size:11px}.vkn{gap:6px}.vkn b{font-size:14px}
  /* Ajustes: metas compactas */
  .ajn{margin:0 -14px;padding:6px 14px!important;background:transparent!important;border:0!important;box-shadow:none!important;scrollbar-width:none}
  .ajn button{background:rgba(255,255,255,.85)}
  .mtw{overflow:visible}.mt2{min-width:0!important;border-spacing:4px 4px}
  .mt2 th:last-child,.mt2 td:last-child{display:none}
  .mt2 th{font-size:10.5px}.mt2 th .dot{display:none}
  .mi2{font-size:0}.mt2 td input{min-width:0!important;font-size:12.5px;padding:8px 6px}
  .mn2{font-size:12px}
  .gt td{font-size:11px}
  /* Kanban */
  .kan{grid-template-columns:repeat(4,86vw)!important;margin:0 -14px;padding:0 14px 8px}
}

function nav(){

  const MAIN=['inicio','actividades','dash','cuentas'],rest=SECCIONES.filter(([k])=>!MAIN.includes(k));
  $('#mtabs').innerHTML=SECCIONES.filter(([k])=>MAIN.includes(k)).map(([k,n])=>`<button data-v="${k}" class="${S.view===k?'on':''}">${icon(k)}<span>${n}</span></button>`).join('')

  const mm=$('#mmas');if(mm)mm.onclick=e=>{e.stopPropagation();S.mas=!S.mas;nav()};

}

function ctx(){
  const R=rango(),fin=R[R.length-1],conC=R.filter(i=>i<=ULTIMO),last=MES[conC.length?conC[conC.length-1]:fin],ch={};
  for(const k of Object.keys(CANALES)){const A=ANUAL[k];
    ch[k]={venta:sum(R.map(i=>A.venta[i])),metaM:sum(R.map(i=>A.meta[i])),metaA:sum(A.meta),ventaA:sum(A.venta.slice(0,fin+1)),
      progs:sum(R.map(i=>MES[i].progs[k])),cobrado:sum(R.map(i=>MES[i].cob[k][0])),pendiente:last.cob[k][1],serie:A.venta.slice(0,Math.min(fin,ULTIMO)+1)}}
  const f=id=>{const n=MES[0][id].length,v=Array(n).fill(0);R.forEach(i=>MES[i][id].forEach((x,j)=>v[j]+=x));return v};
  return {R,fin,cur:fin,ch,fun:{ge:f('ge'),uvm:f('uvm'),gep:f('gep')},sinCierre:R.every(i=>i>ULTIMO)};
}

function hero(c){
  const G=ANUAL.gen,fin=c.fin,tM=sum(G.meta),tV=sum(G.venta.slice(0,fin+1)),exp=sum(G.meta.slice(0,fin+1)),p=pct(tV,tM),pe=pct(exp,tM);
  const cob=sum(Object.values(c.ch).map(x=>x.cobrado)),pen=sum(Object.values(c.ch).map(x=>x.pendiente)),vm=sum(c.R.map(i=>G.venta[i])),mm=sum(c.R.map(i=>G.meta[i]));
  return `<section class="hero ${S.first?'rise':''}"><div>
     <div class="hk"><i></i>Venta acumulada del año al cierre de ${MES_N[fin].toLowerCase()} · todos los canales</div>
     <div class="hn" id="hn" data-v="${tV}">${M(tV)}</div>
     <div class="hs"><b>${p}%</b> de la meta anual de ${m(tM)} · a ${MES_N[fin].toLowerCase()} se esperaba ${pe}%</div>
     <div class="pace"><div class="pt"><div class="f" style="width:${Math.min(p,100)}%"></div><div class="e" style="left:${pe}%"><span>Esperado ${pe}%</span></div></div>
      <div class="pl"><span>Enero</span><span>Abril</span><span>Julio</span><span>Octubre</span><span>Diciembre</span></div></div></div>
    <div class="hstats">
     <div class="hst"><small>Venta del ${unidad()}</small><b>${K(vm)}</b><em>de ${K(mm)} de meta</em></div>
     <div class="hst"><small>Cobrado del ${unidad()}</small><b>${K(cob)}</b><em>${K(pen)} por cobrar</em></div>
     <div class="hst"><small>Efectividad</small><b>${cob+pen?pct(cob,cob+pen)+'%':'—'}</b><em>cobranza del ${unidad()}</em></div></div></section>
   ${c.sinCierre?`<div class="note" style="margin:-6px 0 4px">Este periodo aún no tiene cierre. En la plataforma se llenará automáticamente con lo que registre en Ventas, Propuestas y Cuentas especiales.</div>`:''}`;
}
function spark(serie,k,id){
  const W=300,H=54,mx=Math.max(...serie,1),n=Math.max(serie.length-1,1),X=i=>4+i*(W-8)/n,Y=v=>H-6-(H-14)*v/mx;
  const pts=serie.map((v,i)=>[X(i),Y(v)]),d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' '),last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${k}" stop-opacity=".28"/><stop offset="1" stop-color="${k}" stop-opacity="0"/></linearGradient></defs>
   <path d="${d} L${last[0]},${H} L4,${H} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${k}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
   <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#fff" stroke="${k}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function ring(p,col){const r=18,c=2*Math.PI*r,v=Math.min(p||0,100);
  return `<svg viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="${r}" fill="none" stroke="#E6EBF3" stroke-width="5"/><circle cx="23" cy="23" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 23 23)"/></svg>`}
function general(c){
  return `<section class="sec"><div class="sh on-dark"><div><h2>General del ${unidad()}</h2><p>Programas vendidos, ventas, cobranza y efectividad por canal · ${etiqueta()}</p></div><button class="lnk" id="tnota">${S.nota?'Ocultar regla':'¿Cómo se calcula la efectividad?'}</button></div>
   ${S.nota?`<div class="note" style="margin:-2px 0 14px"><b>Regla de efectividad.</b> Venta y cobranza se miden por separado. Efectividad = pagado ÷ (pagado + por cobrar). En vista trimestral, el pagado es la suma de los tres meses y el por cobrar es el saldo al cierre del último mes, para no contar dos veces un mismo adeudo que sigue pendiente.</div>`:''}
   <div class="g3">${Object.entries(CANALES).map(([k,C],ix)=>{const x=c.ch[k],prog=x.cobrado+x.pendiente,e=pct(x.cobrado,prog),cl=cls(e);
    return `<article class="card ${S.first?'rise':''}" style="--k:${C.k};animation-delay:${.08*ix}s"><span class="glow"></span>
     <div class="chh"><div class="chn">${chB(k)}${C.n}</div><span class="tag">${x.progs} ${x.progs===1?'programa':'programas'}</span></div>
     <div class="gv">${M(x.venta)}</div><div class="gl">Ventas del ${unidad()} · ${etiqueta().toLowerCase()}</div>

const r2=n=>Math.round(n*100)/100;
function fcCalc(G){const ing=sum(G.al.map(a=>a.total)),cob=sum(G.al.map(pagado)),pI=ing*G.fc.pI/100,pE=ing*G.fc.pE/100,eg=G.fc.egr.map(e=>{const mm=e.tipo==='pct'?ing*e.v/100:e.v,mk=e.cat==='Mercadotecnia';return {...e,m:mm,mE:mk?mm/2:mm,mI:mk?mm/2:0}}),te=sum(eg.map(e=>e.m)),teE=sum(eg.map(e=>e.mE)),teI=sum(eg.map(e=>e.mI)),ut=pE-teE,utI=pI-teI;return {ing,cob,pI,pE,eg,te,teE,teI,ut,utI,rent:pE?ut/pE*100:null}}
function partes(tot,n,f1){const base=Math.floor(tot/n*100)/100,out=[];for(let i=0;i<n;i++){let fe='';if(f1){const d=new Date(f1+'T12:00');d.setMonth(d.getMonth()+i);fe=d.toISOString().slice(0,10)}out.push([i===n-1?r2(tot-base*(n-1)):base,fe,0])}return out}
const pagado=a=>sum(a.pagos.filter(p=>p[2]).map(p=>p[0]));
const vencidos=a=>a.pagos.filter(p=>!p[2]&&p[1]<HOY);
const proximo=a=>a.pagos.find(p=>!p[2]&&p[1]>=HOY);
function estadoAl(a){if(pagado(a)>=a.total)return ['Liquidado','#1F9D68'];if(a.acuerdo)return ['Con acuerdo','#7C5CF5'];if(vencidos(a).length)return ['Pago vencido','#E5484D'];return ['Al corriente','#3D7BFF']}
const allAl=()=>IP.flatMap(p=>p.gens.flatMap(g=>g.al.map(a=>({a,p,g}))));
function iKpis(){
  const A=allAl(),tot=sum(A.map(x=>x.a.total)),pag=sum(A.map(x=>pagado(x.a))),ven=A.filter(x=>vencidos(x.a).length&&pagado(x.a)<x.a.total),ac=A.filter(x=>x.a.acuerdo&&pagado(x.a)<x.a.total);
  return `<div class="ckp">
   <div class="hst"><small>Alumnos inscritos</small><b>${A.length}</b><em>${IP.length} programas · ${IP.reduce((n,p)=>n+p.gens.length,0)} generaciones</em></div>
   <div class="hst"><small>Venta total del canal</small><b>${K(tot)}</b><em>${K(pag)} cobrado · ${pct(pag,tot)}%</em></div>
   <div class="hst ${ven.length?'warn':''}"><small>Alumnos con pago vencido</small><b>${ven.length}</b><em>${K(sum(ven.flatMap(x=>vencidos(x.a).map(p=>p[0]))))} vencido</em></div>

}

}

async function iniciar(){
  if(!window.supabase){L0.modo='error';L0.msg='No se pudo cargar la conexión. Revise su internet y recargue la página.';renderLogin();return}
  if(!CONN){L0.modo='conectar';renderLogin();return}
  SB=supabase.createClient(CONN.url,CONN.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.auth=false;L0.modo='nueva';renderLogin()}});
  const {data:{session}}=await SB.auth.getSession();
  if(L0.modo==='nueva'){renderLogin();return}
  if(session)entrar(session);else{L0.modo='entrar';renderLogin()}}
async function entrar(session){
  L0.modo='cargando';renderLogin();DB.uid=session.user.id;DB.email=session.user.email;
  try{await cargar()}catch(e){L0.modo='entrar';L0.err={pass:'No se pudo leer la información ('+esc(e.message||e)+'). Verifique que el script de la base de datos se haya ejecutado.'};renderLogin();return}
  S.auth=true;S.view='inicio';S.first=true;render();scrollTo(0,0);ajustarLogosGuardados();

  avisosCargar();setInterval(()=>{if(document.visibilityState==='visible')avisosCargar()},120000)}

/* ===== Meses calculados con la información de la plataforma (desde noviembre de 2026) ===== */
const PROSPM={};
function sincronizar(){
  ULTIMO=Math.min(11,Math.max(ULTIMO_H,HOY.startsWith('2026')?Number(HOY.slice(5,7))-1:11));
  const mesDe=d=>d&&d.startsWith('2026-')?Number(d.slice(5,7))-1:-1,finMes=i=>'2026-'+String(i+1).padStart(2,'0')+'-31';
  for(let i=ULTIMO_H+1;i<12;i++){
    const M2={progs:{exp:0,uvm:0,iada:0},cob:{exp:[0,0],uvm:[0,0],iada:[0,0]},ge:PROSPM[i]||[0,0,0,0,0,0,0],uvm:[0,0,0,0,0],gep:[0,0,0,0,0]},ven={exp:0,uvm:0,iada:0};
    VENTAS.forEach(v=>{const p=propV(v);if(!p||!ctaOf(p))return;const o=ctaOf(p).origen;if(mesDe(v.fv)===i){ven[o]+=Number(p.m)||0;M2.progs[o]++}
      v.pagos.forEach(pg=>{if(pg.conf&&mesDe(pg.conf)===i)M2.cob[o][0]+=pg.m;if(!pg.conf&&pg.f<=finMes(i))M2.cob[o][1]+=pg.m})});
    IP.forEach(P=>P.gens.forEach(G=>G.al.forEach(a=>{const fi=a.ins||(a.pagos[0]&&a.pagos[0][1]);if(mesDe(fi)===i){ven.iada+=Number(a.total)||0;M2.progs.iada++}
      a.pagos.forEach(pg=>{if(pg[2]&&mesDe(pg[1])===i)M2.cob.iada[0]+=pg[0];if(!pg[2]&&pg[1]<=finMes(i))M2.cob.iada[1]+=pg[0]})})));
    PROP.forEach(p=>{const c=ctaOf(p);if(!c)return;const id=c.origen==='uvm'?'uvm':'gep';
      if(mesDe(p.fecha)===i){M2[id][0]++;if(p.f==='Descartada')M2[id][1]++;if(p.f==='Negociación')M2[id][2]++;if(p.f==='Venta')M2[id][3]++}
      else if(p.f==='Venta'&&mesDe(p.fv)===i)M2[id][4]++});
    MES[i]=M2;['exp','uvm','iada'].forEach(k=>ANUAL[k].venta[i]=r2(ven[k]));
  }
  ANUAL.gen.meta=ANUAL.exp.meta.map((v,i)=>v+ANUAL.uvm.meta[i]+ANUAL.iada.meta[i]);
  ANUAL.gen.venta=ANUAL.exp.venta.map((v,i)=>v+ANUAL.uvm.venta[i]+ANUAL.iada.venta[i]);
}

  metas:()=>({exp:ANUAL.exp.meta,uvm:ANUAL.uvm.meta,iada:ANUAL.iada.meta}),prosp:()=>PROSPM,ajustes:()=>CFG,
  catalogos:()=>({MOTIVOS,MEDIOS,TIPOS,MODS,ADIC,AREAS,FPAGO,CATS}),
  canales:()=>({prosp:PROSP,ch:Object.fromEntries(Object.entries(CANALES).map(([k,c])=>[k,{k:c.k,logo:c.logo||null,lt:c.lt||0}]))})};
const llenarA=(arr,src)=>{arr.splice(0,arr.length,...(Array.isArray(src)?src:[]))};
const llenarO=(o,src)=>{for(const k of Object.keys(o))delete o[k];Object.assign(o,src&&typeof src==='object'?src:{})};
function aplicar(k,d){if(d==null)return;switch(k){
  case 'cuentas':llenarA(CTA,d);break;case 'empresas':llenarO(EMP,d);break;case 'propuestas':llenarA(PROP,d);break;case 'ventas':llenarA(VENTAS,d);break;
  case 'iada':llenarA(IP,d);break;case 'actividades':llenarA(ACT,d);break;case 'comisiones':llenarO(COMO,d);break;
  case 'metas':['exp','uvm','iada'].forEach(c=>{if(Array.isArray(d[c])&&d[c].length===12)ANUAL[c].meta=d[c].map(Number)});break;
  case 'prosp':llenarO(PROSPM,d);for(const i in PROSPM)if(+i<=ULTIMO_H&&MES[i])MES[i].ge=PROSPM[i];break;
  case 'ajustes':Object.assign(CFG,d);break;
  case 'catalogos':for(const [n,arr] of [['MOTIVOS',MOTIVOS],['MEDIOS',MEDIOS],['TIPOS',TIPOS],['MODS',MODS],['ADIC',ADIC],['AREAS',AREAS],['FPAGO',FPAGO],['CATS',CATS]])if(Array.isArray(d[n])&&d[n].length)llenarA(arr,d[n]);break;
  case 'canales':if(d.prosp)PROSP=d.prosp;for(const [c,v] of Object.entries(d.ch||{}))if(CANALES[c]){CANALES[c].k=v.k;CANALES[c].logo=v.logo||null;CANALES[c].lt=v.lt||0;if(ORIG[c])ORIG[c].k=v.k}break}}
function recontar(){const mx=(arr,b)=>Math.max(b,...arr.map(Number).filter(Number.isFinite))+1;
  NID=mx([...CTA.map(c=>c.id),...Object.keys(EMP).map(k=>String(k).replace(/^e/,''))],99);PID=mx(PROP.map(p=>p.id),499);VID=mx(VENTAS.map(v=>v.id),899);AID=mx(ACT.map(a=>a.id),0);
  IAID=mx([...IP.map(p=>String(p.id).slice(1)),...IP.flatMap(p=>p.gens.map(g=>String(g.id).slice(1))),...IP.flatMap(p=>p.gens.flatMap(g=>g.al.map(a=>a.id)))],49)}

  const got={};(data||[]).forEach(r=>{if(COL[r.clave]){got[r.clave]=1;aplicar(r.clave,r.datos)}});
  recontar();sincronizar();for(const k in COL)DB.hash[k]=got[k]?JSON.stringify(COL[k]()):null;
  if(Object.keys(got).length<Object.keys(COL).length)dbGuardar()}

async function dbGuardar(){if(!SB||!DB.uid)return;if(DB.enCurso){DB.otra=true;return}const rows=[],nuevos={};
  for(const k in COL){const j=JSON.stringify(COL[k]());if(j!==DB.hash[k]){rows.push({user_id:DB.uid,clave:k,datos:JSON.parse(j),actualizado:new Date().toISOString()});nuevos[k]=j}}
  if(!rows.length)return;DB.enCurso=true;estadoG('guardando');const {error}=await SB.from('exp_datos').upsert(rows);DB.enCurso=false;
  if(error){estadoG('error',error.message);clearTimeout(DB.t);DB.t=setTimeout(dbGuardar,8000);return}
  Object.assign(DB.hash,nuevos);estadoG('ok');if(DB.otra){DB.otra=false;dbGuardar()}}

const nomC=c=>esc(c.nom+' '+c.ape);
function eliminar(t,a,b){
  if(t==='cta'){const c=CTA.find(x=>x.id===+a);if(!c)return;const np=PROP.filter(p=>p.cid===c.id).length;
    if(np)return bloqueo('No se puede eliminar todavía',`${nomC(c)} tiene ${np} ${np===1?'propuesta registrada':'propuestas registradas'}. Elimínelas primero en Propuestas o, si solo hay un dato equivocado, use Editar.`);
    const na=ACT.filter(x=>x.asoc==='cuenta'&&x.ref===c.id).length;
    return confirmar('Eliminar contacto',`Se eliminará a ${nomC(c)} con ${c.segs.length} ${c.segs.length===1?'seguimiento':'seguimientos'}${na?` y ${na} ${na===1?'actividad':'actividades'}`:''}. Esta acción no se puede deshacer.`,'Eliminar contacto',()=>{CTA.splice(CTA.indexOf(c),1);for(let i=ACT.length-1;i>=0;i--)if(ACT[i].asoc==='cuenta'&&ACT[i].ref===c.id)ACT.splice(i,1);C.open=null})}
  if(t==='seg'){const c=CTA.find(x=>x.id===+a),sg=c&&c.segs[+b];if(!sg)return;
    return confirmar('Eliminar seguimiento',`Se eliminará el seguimiento del ${fmtF(sg.f)} con ${nomC(c)}.`,'Eliminar',()=>{c.segs.splice(+b,1)})}
  if(t==='emp'){const e=EMP[a];if(!e)return;const n=CTA.filter(c=>c.emp===a).length;
    if(n)return bloqueo('No se puede eliminar todavía',`${esc(e.n)} tiene ${n} ${n===1?'contacto':'contactos'}. Elimínelos o cámbielos de empresa primero; si solo hay un dato equivocado, use Editar empresa.`);
    return confirmar('Eliminar empresa',`Se eliminará ${esc(e.n)}.`,'Eliminar empresa',()=>{delete EMP[a];C.openEmp=null})}
  if(t==='prop'){const p=PROP.find(x=>x.id===+a);if(!p)return;
    if(VENTAS.some(v=>v.pid===p.id))return bloqueo('No se puede eliminar todavía',`La propuesta ${esc(p.n)} ya tiene una venta registrada. Elimine primero la venta en Ventas.`);
    return confirmar('Eliminar propuesta',`Se eliminará la propuesta ${esc(p.n)}. Sus seguimientos se conservan en la ficha del contacto, sin la liga a la propuesta.`,'Eliminar propuesta',()=>{PROP.splice(PROP.indexOf(p),1);CTA.forEach(c=>c.segs.forEach(sg=>{if(sg.prop===p.id)sg.prop=null}));P2.open=null})}
  if(t==='venta'){const v=VENTAS.find(x=>x.id===+a);if(!v)return;const p=PROP.find(x=>x.id===v.pid);
    return confirmar('Eliminar venta',`Se eliminará la venta${p?' de '+esc(p.n):''} con su calendario de ${v.pagos.length} ${v.pagos.length===1?'pago':'pagos'}, sus seguimientos y sus comisiones. La propuesta regresará a la fase Negociación.`,'Eliminar venta',()=>{VENTAS.splice(VENTAS.indexOf(v),1);if(p){p.f='Negociación';delete p.fv}for(const k of Object.keys(COMO))if(k==='v'+v.id||k.startsWith('v'+v.id+'p'))delete COMO[k];V.open=null})}
  if(t==='act'){const x=ACT.find(y=>y.id===+a);if(!x)return;
    return confirmar('Eliminar actividad',`Se eliminará la actividad ${esc(x.t)}.`,'Eliminar actividad',()=>{ACT.splice(ACT.indexOf(x),1);A.open=null})}
  if(t==='al'){let G0=null,al=null;IP.forEach(P=>P.gens.forEach(G=>G.al.forEach(z=>{if(z.id===+a){G0=G;al=z}})));if(!al)return;
    return confirmar('Eliminar alumno',`Se eliminará a ${esc(al.n)} con su calendario de pagos.`,'Eliminar alumno',()=>{G0.al.splice(G0.al.indexOf(al),1);I.open=null})}
  if(t==='gen'){const P=IP.find(x=>x.id===a),G=P&&P.gens.find(x=>x.id===b);if(!G)return;
    return confirmar('Eliminar generación',`Se eliminará ${esc(G.n)} de ${esc(P.n)}${G.al.length?` con sus ${G.al.length} alumnos y sus pagos`:''}, su forecast y su comisión.`,'Eliminar generación',()=>{P.gens.splice(P.gens.indexOf(G),1);delete COMO['g'+G.id];I.gen=P.gens[0]?P.gens[0].id:null})}
  if(t==='prog'){const P=IP.find(x=>x.id===a);if(!P)return;const na=P.gens.reduce((s2,g)=>s2+g.al.length,0);
    return confirmar('Eliminar programa',`Se eliminará ${esc(P.n)} con ${P.gens.length} ${P.gens.length===1?'generación':'generaciones'}${na?` y ${na} alumnos`:''}.`,'Eliminar programa',()=>{P.gens.forEach(g=>delete COMO['g'+g.id]);IP.splice(IP.indexOf(P),1);I.prog=IP[0]?IP[0].id:null;I.gen=IP[0]&&IP[0].gens[0]?IP[0].gens[0].id:null})}
}

function procesarLogo(src,cb){const im=new Image();im.onload=()=>{
  const W0=im.naturalWidth||im.width,H0=im.naturalHeight||im.height,k=Math.min(1,600/Math.max(W0,H0)),W=Math.max(1,Math.round(W0*k)),H=Math.max(1,Math.round(H0*k));
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,W,H);
  let d;try{d=x.getImageData(0,0,W,H).data}catch(e){cb(src);return}
  const px=(i,j)=>{const o=(j*W+i)*4;return [d[o],d[o+1],d[o+2],d[o+3]]};
  const esq=[px(0,0),px(W-1,0),px(0,H-1),px(W-1,H-1)],bg=esq[0],opaco=bg[3]>200;
  const fondo=p=>p[3]<20||(opaco&&Math.abs(p[0]-bg[0])<24&&Math.abs(p[1]-bg[1])<24&&Math.abs(p[2]-bg[2])<24);
  let x0=W,y0=H,x1=-1,y1=-1;for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(!fondo(px(i,j))){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<0){x0=0;y0=0;x1=W-1;y1=H-1}
  const w=x1-x0+1,h=y1-y0+1,lado=Math.round(Math.max(w,h)*(opaco?1:1.1)),Z=160,o=document.createElement('canvas');o.width=Z;o.height=Z;const ox=o.getContext('2d');
  if(opaco){ox.fillStyle=`rgb(${bg[0]},${bg[1]},${bg[2]})`;ox.fillRect(0,0,Z,Z)}
  const e=Z/lado;ox.drawImage(c,x0,y0,w,h,(Z-w*e)/2,(Z-h*e)/2,w*e,h*e);cb(o.toDataURL('image/png'))};im.onerror=()=>cb(src);im.src=src}
function leerLogo(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>procesarLogo(r.result,cb);r.readAsDataURL(f)}
function ajustarLogosGuardados(){let n=0;const fin=()=>{if(--n===0)keep(()=>{})};
  for(const e of Object.values(EMP))if(e.logo&&!e.lt){n++;procesarLogo(e.logo,u=>{e.logo=u;e.lt=1;fin()})}
  for(const c of Object.values(CANALES))if(c.logo&&!c.lt){n++;procesarLogo(c.logo,u=>{c.logo=u;c.lt=1;fin()})}}
